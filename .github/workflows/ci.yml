name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          bash -n setup.sh uninstall.sh .bashrc
          shellcheck setup.sh uninstall.sh .bashrc

      - name: Validate config files
        run: |
          python3 - <<'EOF'
          import json, tomllib
          with open('starship.toml', 'rb') as f:
              tomllib.load(f)
          print('starship.toml: valid TOML')
          with open('fastfetch/config.jsonc') as f:
              json.load(f)
          print('fastfetch/config.jsonc: valid JSON')
          EOF

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Smoke test
        run: |
          ./target/release/bashbox --list
          ./target/release/bashbox --list --json | python3 -m json.tool >/dev/null
          ./target/release/bashbox --recent
          ./target/release/bashbox --logs
          ./target/release/bashbox --doctor
          ./target/release/bashbox --version
          ./target/release/bashbox --help
          ./target/release/bashbox --run "Disk usage" --dry-run
          ./target/release/bashbox --completions bash > /tmp/bashbox.bash
          bash -n /tmp/bashbox.bash
          ./target/release/bashbox --completions zsh > /tmp/_bashbox
          ./target/release/bashbox --completions fish > /tmp/bashbox.fish
          ./target/release/bashbox --run "TLS certificate check" --arg example.com --dry-run | grep -q openssl
          ./target/release/bashbox --list --json | python3 -c 'import json,sys; tasks=json.load(sys.stdin); assert len(tasks) >= 140, len(tasks); assert len({t["name"] for t in tasks}) == len(tasks)'

  smoke-test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Run setup.sh
        run: |
          ./setup.sh && echo "=== SETUP OK ==="

      - name: Verify interactive shell
        env:
          TERM: xterm-256color
        run: |
          test -L "$HOME/.bashrc"
          test -e "$HOME/.bashrc.bashbox-backup"
          bash -ic "echo BASHRC_PROMPT_OK" 2>&1 | grep -q BASHRC_PROMPT_OK

      - name: Uninstall and restore
        run: |
          ./uninstall.sh
          test ! -L "$HOME/.bashrc"
          test -f "$HOME/.bashrc"
          echo "=== UNINSTALL OK ==="

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, rust, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui

      - name: Build
        run: cargo build --locked --release

      - name: Checksum
        run: sha256sum target/release/bashbox > target/release/bashbox.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tui/target/release/bashbox
            tui/target/release/bashbox.sha256
          generate_release_notes: true
