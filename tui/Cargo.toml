[package]
name = "bashbox"
version = "0.1.0"
edition = "2021"
description = "bashbox toolbox - a terminal UI for everyday Linux tasks"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
